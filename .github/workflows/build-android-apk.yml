name: Build Angkea Sil Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install required Android packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk downloads/AngkeaSilLearning.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AngkeaSilLearning-APK
          path: downloads/AngkeaSilLearning.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/AngkeaSilLearning.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Build Android APK [skip ci]"
            git push
          fi
