name: Build SP Pro Native APK

on:
  push:
    branches: [ sp-pro-rebuild-apk ]
    paths:
      - 'sp_pro_native/**'
      - '.github/workflows/sp-pro-native-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: sp-pro-rebuild-apk

      - name: Build APK with Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          cd sp_pro_native
          ANDROID_JAR=$(ls "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          AAPT2="$BUILD_TOOLS/aapt2"
          D8="$BUILD_TOOLS/d8"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          rm -rf build
          mkdir -p build/gen build/classes build/dex
          "$AAPT2" compile --dir res -o build/resources.zip
          "$AAPT2" link \
            -o build/resources.apk \
            -I "$ANDROID_JAR" \
            --manifest AndroidManifest.xml \
            --java build/gen \
            --min-sdk-version 23 \
            --target-sdk-version 35 \
            build/resources.zip
          javac -source 8 -target 8 -classpath "$ANDROID_JAR" -d build/classes $(find src build/gen -name '*.java')
          "$D8" --lib "$ANDROID_JAR" --min-api 23 --output build/dex $(find build/classes -name '*.class')
          cp build/resources.apk build/unsigned.apk
          (cd build/dex && zip -q -u ../unsigned.apk classes.dex)
          "$ZIPALIGN" -f 4 build/unsigned.apk build/aligned.apk
          keytool -genkeypair -v \
            -keystore build/sp-pro.keystore \
            -alias sp-pro \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=SP Pro, O=SP Pro, C=KH"
          "$APKSIGNER" sign \
            --ks build/sp-pro.keystore \
            --ks-key-alias sp-pro \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out build/SP_Pro_Rebuild_v2.apk \
            build/aligned.apk
          "$APKSIGNER" verify --verbose build/SP_Pro_Rebuild_v2.apk

      - name: Save APK to branch
        shell: bash
        run: |
          mkdir -p downloads
          cp sp_pro_native/build/SP_Pro_Rebuild_v2.apk downloads/SP_Pro_Rebuild_v2.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/SP_Pro_Rebuild_v2.apk
          git commit -m "Build SP Pro native APK" || exit 0
          git push origin HEAD:sp-pro-rebuild-apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SP-Pro-Rebuild-v2-Native-APK
          path: sp_pro_native/build/SP_Pro_Rebuild_v2.apk
