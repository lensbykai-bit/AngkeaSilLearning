<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-label="ប្រាសាទអង្គរវត្តបែបគំនូរពណ៌ទន់">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dce9ff"/>
    <stop offset=".48" stop-color="#f7e6d4"/>
    <stop offset="1" stop-color="#f7cfae"/>
  </linearGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#536d7e"/>
    <stop offset="1" stop-color="#2f4658"/>
  </linearGradient>
  <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9db28e"/>
    <stop offset="1" stop-color="#657f68"/>
  </linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
</defs>

<rect width="900" height="620" rx="48" fill="url(#sky)"/>
<circle cx="695" cy="150" r="72" fill="#ffd7a4" opacity=".55" filter="url(#soft)"/>
<circle cx="695" cy="150" r="48" fill="#fff1ca" opacity=".9"/>

<!-- distant haze -->
<path d="M0 360 C120 330 230 350 340 330 C470 305 610 335 900 310 L900 455 L0 455Z" fill="#b8c4bb" opacity=".34"/>

<!-- grass -->
<path d="M0 415 C130 392 260 430 390 406 C520 382 682 422 900 391 L900 620 L0 620Z" fill="url(#grass)"/>
<path d="M0 500 C185 470 330 525 520 482 C650 452 760 475 900 456" fill="none" stroke="#d4dfbe" stroke-width="18" opacity=".75"/>

<!-- palm -->
<g transform="translate(100 300)" opacity=".88">
  <path d="M0 200 C18 135 18 84 12 25" fill="none" stroke="#554f43" stroke-width="12" stroke-linecap="round"/>
  <g fill="#496f5a">
    <path d="M12 28 C-50 2 -80 -12 -118 5 C-58 30 -23 36 10 38Z"/>
    <path d="M12 28 C54 -12 88 -25 126 -8 C76 20 46 33 12 39Z"/>
    <path d="M10 26 C-11 -31 -4 -67 21 -92 C30 -36 27 -3 17 31Z"/>
    <path d="M14 30 C53 2 86 7 110 34 C66 45 42 43 13 38Z"/>
    <path d="M8 32 C-40 36 -75 55 -91 89 C-38 75 -12 59 10 39Z"/>
  </g>
</g>

<!-- temple silhouette -->
<g transform="translate(215 188)">
  <!-- base -->
  <rect x="0" y="248" width="470" height="65" rx="8" fill="#40586a"/>
  <rect x="35" y="212" width="402" height="44" rx="6" fill="#4d6678"/>
  <rect x="73" y="178" width="326" height="40" rx="5" fill="#587182"/>

  <!-- towers -->
  <g fill="url(#stone)">
    <path d="M42 245 V150 H98 V245Z"/>
    <path d="M372 245 V150 H428 V245Z"/>
    <path d="M123 245 V104 H183 V245Z"/>
    <path d="M287 245 V104 H347 V245Z"/>
    <path d="M203 245 V44 H267 V245Z"/>
  </g>

  <g fill="#355064">
    <path d="M42 150 L70 116 L98 150Z"/>
    <path d="M372 150 L400 116 L428 150Z"/>
    <path d="M123 104 L153 68 L183 104Z"/>
    <path d="M287 104 L317 68 L347 104Z"/>
    <path d="M203 44 L235 0 L267 44Z"/>
  </g>

  <!-- layered Khmer tower details -->
  <g fill="none" stroke="#7e96a1" stroke-width="7" opacity=".72">
    <path d="M216 54 H254 M211 69 H259 M208 84 H262"/>
    <path d="M134 114 H172 M131 129 H175"/>
    <path d="M298 114 H336 M295 129 H339"/>
  </g>

  <!-- doors/windows -->
  <g fill="#233d50">
    <rect x="226" y="171" width="28" height="74" rx="14"/>
    <rect x="142" y="179" width="20" height="50" rx="10"/>
    <rect x="308" y="179" width="20" height="50" rx="10"/>
    <rect x="61" y="182" width="18" height="42" rx="9"/>
    <rect x="391" y="182" width="18" height="42" rx="9"/>
  </g>
</g>

<!-- foreground path -->
<path d="M362 620 C402 535 455 484 514 450 C552 428 602 415 661 410 C610 445 577 480 554 520 C529 565 525 596 520 620Z" fill="#d9cbb1" opacity=".82"/>

<!-- subtle frame accents -->
<path d="M35 92 C92 55 148 44 210 48" fill="none" stroke="#ffffff" stroke-width="4" opacity=".45"/>
<path d="M690 556 C746 532 798 530 850 545" fill="none" stroke="#e8f0e5" stroke-width="6" opacity=".5"/>
</svg>
