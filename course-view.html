<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>មេរៀន — អង្គាសីល ល័ននីង</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="course-view-page">
  <header class="course-view-header">
    <div class="container course-view-nav">
      <a class="brand" href="index.html">
        <img src="assets/logo.svg" alt="អង្គាសីល ល័ននីង">
        <span><strong>អង្គាសីល ល័ននីង</strong><small>បន្ទប់រៀន</small></span>
      </a>
      <a href="my-courses.html">← មេរៀនរបស់ខ្ញុំ</a>
    </div>
  </header>

  <main class="container course-view-layout" id="courseView">
    <aside class="lesson-sidebar">
      <h2 id="sidebarTitle">កំពុងផ្ទុក...</h2>
      <p>មេរៀនត្រូវបានរៀបជាជំហានៗ ដើម្បីឲ្យងាយតាមដាន។</p>
      <div class="module-list" id="moduleList"></div>
    </aside>
    <section class="lesson-main">
      <div class="lesson-player">
        <div class="lesson-player-inner">
          <div class="play-button">▶</div>
          <h1 id="lessonTitle">សូមស្វាគមន៍</h1>
          <p id="lessonSubtitle">មាតិកាវីដេអូនឹងត្រូវដាក់នៅទីនេះ។</p>
        </div>
      </div>
      <article class="lesson-info">
        <h3>អំពីមេរៀននេះ</h3>
        <p id="lessonDescription">កំពុងផ្ទុកព័ត៌មានវគ្គសិក្សា...</p>
      </article>
    </section>
  </main>

  <script src="course-view.js"></script>
</body>
</html>
