name: pinka_ai
description: PINKA Ai Android app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^12.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/pinka_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/pinka_logo.png
  adaptive_icon_background: '#0C0F14'
  adaptive_icon_foreground: assets/images/pinka_logo.png
  min_sdk_android: 21
